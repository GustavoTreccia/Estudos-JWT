spring.application.name=JWTStudyModern

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# SMTP: configure MAIL_HOST, MAIL_PORT, MAIL_USERNAME and MAIL_PASSWORD for a real provider.
# MailHog/Mailpit commonly use localhost:1025 during local development.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

app.auth.jwt-secret=${JWT_SECRET:VGhpcy1pcy1hLWRldmVsb3BtZW50LXNlY3JldC1rZXktYXQtbGVhc3QtMzItYnl0ZXM=}
app.auth.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.auth.confirmation-base-url=${CONFIRMATION_BASE_URL:http://localhost:8080/api/auth/confirm?token=}
app.auth.confirmation-expiration-hours=${CONFIRMATION_EXPIRATION_HOURS:24}
app.auth.email-from=${EMAIL_FROM:no-reply@jwt-study.local}