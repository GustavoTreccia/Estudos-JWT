services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Execute scripts/generate-dev-secrets.sh}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 15
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  app:
    build: .
    user: "${LOCAL_UID:?Execute scripts/generate-dev-secrets.sh}:${LOCAL_GID:?Execute scripts/generate-dev-secrets.sh}"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth
      DB_PASSWORD: ${DB_PASSWORD}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      VERIFICATION_CODE_SECRET: ${VERIFICATION_CODE_SECRET}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8080}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-auth-api}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-web-client}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://127.0.0.1:8081/callback}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@example.test}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ./.local:/app/.local:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
volumes:
  postgres-data:
