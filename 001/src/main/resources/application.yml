server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth}
    username: ${DB_USERNAME:auth}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      initialize-schema: never
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:false}
      "[mail.smtp.starttls.required]": ${SMTP_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
app:
  auth:
    issuer: ${AUTH_ISSUER:http://localhost:8080}
    audience: ${AUTH_AUDIENCE:auth-api}
    client-id: ${OAUTH_CLIENT_ID:web-client}
    client-secret: ${OAUTH_CLIENT_SECRET}
    redirect-uri: ${OAUTH_REDIRECT_URI:http://127.0.0.1:8081/callback}
    code-secret: ${VERIFICATION_CODE_SECRET}
    mail-from: ${MAIL_FROM:no-reply@example.test}
    private-key: ${JWT_PRIVATE_KEY:file:./.local/private.pem}
    public-key: ${JWT_PUBLIC_KEY:file:./.local/public.pem}
